# Integrazione continua del checkout condiviso (gratuita: repository pubblico).
# Esegue test, generazione delle pagine (se presente) e controlli di sicurezza su ogni richiesta di unione e su main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test e controlli
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - name: Dipendenze
        run: npm ci --no-audit --no-fund
      - name: Test automatici
        run: npm test
      - name: Generazione pagine
        run: npm run pagine --if-present
      - name: Controlli di sicurezza (credenziali, vendite reali)
        run: node scripts/controlli-sicurezza.mjs
