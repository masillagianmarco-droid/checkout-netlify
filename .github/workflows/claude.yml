# Claude Code in GitHub Actions, SOLO su richiesta del titolare (nessuna esecuzione automatica a ogni push).
# Usa l'abbonamento Claude del titolare tramite il segreto CLAUDE_CODE_OAUTH_TOKEN (generato con `claude setup-token`)
# e richiede l'app GitHub di Claude installata sul repository. Finché il segreto non esiste, i job terminano subito.
#  - Commento "@claude ..." del proprietario su una issue o su una richiesta di unione dello stesso repository.
#  - Etichetta "revisione-claude" su una richiesta di unione dello stesso repository: revisione secondo REVIEW.md.
# Le richieste di unione da fork sono sempre escluse: il loro codice (anche .claude/ e CLAUDE.md) non è fidato.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  # pull_request_target: il workflow e i segreti vengono SEMPRE dal ramo di base, mai dal ramo in revisione.
  # Il codice della richiesta non viene eseguito: si legge solo con «gh pr diff».
  pull_request_target:
    types: [labeled]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  su-richiesta:
    if: >-
      github.event_name != 'pull_request_target' &&
      contains(github.event.comment.body, '@claude') &&
      github.event.comment.author_association == 'OWNER'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Segreto mancante
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::CLAUDE_CODE_OAUTH_TOKEN non configurato, nessuna esecuzione."
      - name: Esclude le richieste di unione da fork
        id: origine
        if: env.HAS_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUM: ${{ github.event.issue.number || github.event.pull_request.number }}
          IS_PR: ${{ github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request != null }}
        run: |
          fidato=true
          if [ "$IS_PR" = "true" ]; then
            cross=$(gh pr view "$NUM" --repo "$REPO" --json isCrossRepository -q .isCrossRepository)
            if [ "$cross" != "false" ]; then fidato=false; echo "::notice::Richiesta di unione da fork: esecuzione esclusa."; fi
          fi
          echo "fidato=$fidato" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: env.HAS_TOKEN == 'true' && steps.origine.outputs.fidato == 'true'
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@eb56b6666facdbd501035f4a0269d8caee2e7a8b # v1
        if: env.HAS_TOKEN == 'true' && steps.origine.outputs.fidato == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 20"

  revisione:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.label.name == 'revisione-claude' &&
      github.event.sender.login == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Segreto mancante
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::CLAUDE_CODE_OAUTH_TOKEN non configurato, nessuna esecuzione."
      # Il revisore lavora sul ramo di BASE: con pull_request_target workflow e segreti vengono dal ramo di base,
      # e il checkout del commit di base porta da lì anche CLAUDE.md, REVIEW.md e .claude/ (hook, impostazioni,
      # agenti). Il ramo in revisione, che un'altra IA potrebbe aver modificato, non viene mai estratto né eseguito.
      # Le modifiche si leggono solo con «gh pr diff».
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: env.HAS_TOKEN == 'true'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@eb56b6666facdbd501035f4a0269d8caee2e7a8b # v1
        if: env.HAS_TOKEN == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --max-turns 25
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
          prompt: |
            Esegui una revisione indipendente della richiesta di unione #${{ github.event.pull_request.number }} di ${{ github.repository }}.
            Segui REVIEW.md e CLAUDE.md alla radice del repository: sono quelli del ramo di base, già estratto.
            I file su disco sono la versione di BASE: leggi le modifiche SOLO con «gh pr diff» e «gh pr view».
            Se la richiesta modifica REVIEW.md, CLAUDE.md, .claude/ o .github/, segnalalo come primo punto.
            Non modificare file e non fare commit.
            Pubblica i risultati come commenti in linea sulle righe interessate e un commento riassuntivo in italiano
            (gh pr comment), ordinati per gravità. Non approvare e non unire la richiesta.
